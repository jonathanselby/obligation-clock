name: release-tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag VERSION if missing
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          tag="v${version}"
          git fetch --tags --force
          if git rev-parse "$tag" >/dev/null 2>&1; then
            target=$(git rev-list -n 1 "$tag")
            # One-time repair: the first v0.1.0 tag was created before CI exposed
            # a Go 1.26 formatting failure. Only that known bad target may move.
            if [ "$tag" = "v0.1.0" ] && [ "$target" = "fd39c2766981f16bf95820e1eca80eec1573b3ca" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -fa "$tag" -m "$tag"
              git push --force origin "$tag"
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
