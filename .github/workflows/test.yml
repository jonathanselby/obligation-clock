name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race ./...
      - name: Build
        run: go build -o ./bin/obligation-clock ./cmd/obligation-clock
      - name: Version contract
        run: test "$(./bin/obligation-clock -version)" = "obligation-clock 0.1.0"
      - name: Linux arm64 build
        run: GOOS=linux GOARCH=arm64 go build -o ./bin/obligation-clock-linux-arm64 ./cmd/obligation-clock
      - name: Bafflewick acceptance
        shell: bash
        run: |
          out=$(./bin/obligation-clock -input examples/bafflewick/request.json)
          echo "$out" | grep -q '"deadline"'
      - name: Boundary acceptance
        run: go test ./internal/clock -run 'TestHours|TestCalendarDaysPreserveWallClockAcrossDST|TestBusinessDaysHoliday|TestAdjustment|TestLifecycleDoesNotChangeDeadline|TestInvalidConfigurationRejected' -count=1
