name: test

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Format contract
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Go files requiring gofmt:"
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -o ./bin/obligation-clock ./cmd/obligation-clock
      - name: Version contract
        run: test "$(./bin/obligation-clock -version)" = "obligation-clock 0.1.0"
      - name: Linux arm64 build
        run: GOOS=linux GOARCH=arm64 go build -o ./bin/obligation-clock-linux-arm64 ./cmd/obligation-clock
      - name: Bafflewick acceptance
        shell: bash
        run: |
          out=$(./bin/obligation-clock -input examples/bafflewick/request.json)
          echo "$out" | grep -q '"deadline":"2026-10-21T17:00:00+11:00"'
          echo "$out" | grep -q '"lifecycle":"firm"'
      - name: Calendar-boundary acceptance
        run: >-
          go test ./internal/clock
          -run 'TestHours|TestHoursAreElapsedAcrossDST|TestCalendarDaysPreserveWallClockAcrossDST|TestCalendarDayRejectsDSTGap|TestBusinessDaysHoliday|TestCustomWeekend|TestAdjustment|TestPreviousBusinessDayAdjustment|TestLifecycleDoesNotChangeDeadline|TestInvalidCalendarAndContract|TestTriggerOffsetMustMatchTimezone'
          -count=1
